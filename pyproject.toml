[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mort-lang"
version = "0.44.0"
description = "The Mort statically typed systems programming language"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography==49.0.0"]
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "0xmortuex" },
]
keywords = ["compiler", "programming-language", "systems-programming", "c", "osdev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
]

[project.scripts]
mortc = "mortc:main"

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "pytest>=8",
    # Exact pin: ruff's default rule set changes between minor versions and
    # CI lints with defaults, so a floating version can break CI overnight
    # with no code change (it did on 2026-07-24, 0.15 -> 0.16). Bump
    # deliberately, fixing new findings in the same commit.
    "ruff==0.16.0",
    "ziglang",
]

[project.urls]
Homepage = "https://github.com/0xmortuex/Mort"
Repository = "https://github.com/0xmortuex/Mort"
Issues = "https://github.com/0xmortuex/Mort/issues"

[tool.setuptools]
packages = ["mort", "mort.vendor"]
py-modules = ["mortc"]

[tool.setuptools.package-data]
mort = [
    "vendor/*",
]

[tool.setuptools.data-files]
mort-stdlib = [
    "std/algorithm.mx",
    "std/atomic.mx",
    "std/bytes.mx",
    "std/crypto.mx",
    "std/env.mx",
    "std/fs.mx",
    "std/http.mx",
    "std/https.mx",
    "std/map.mx",
    "std/math.mx",
    "std/memory.mx",
    "std/mutex.mx",
    "std/net.mx",
    "std/option.mx",
    "std/owned_string.mx",
    "std/process.mx",
    "std/random.mx",
    "std/result.mx",
    "std/string.mx",
    "std/task.mx",
    "std/time.mx",
    "std/thread.mx",
    "std/tls.mx",
    "std/vec.mx",
    "std/websocket.mx",
]
